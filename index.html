<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html,body{margin:0}body{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Планер событий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, white ground, tinted tiles; quick-add bar pinned to the bottom */
:root{
  --bg:#FFFFFF; --ink:#2F3A4F; --muted:#6B7385; --soft:#556074; --surface:#F4F6F9; --line:#E3E5EA;
  --o:#F89A6F; --o-tint:#FDE3D6; --o-deep:#C4592A; --o-text:#9C3509;
  --g:#A7C048; --g-tint:#EEF3DC; --g-deep:#5B7716; --g-todo:#E4EDC4; --g-text:#3F5410;
  --display:'Nunito', ui-rounded, system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px;box-sizing:border-box}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:900;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* top of home */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top h1{font-size:34px;line-height:1.05}
.actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.plus{width:52px;height:52px;border-radius:18px;border:0;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center}
.plus svg.i{width:26px;height:26px;stroke-width:2.6}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* event cards on home */
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.hero{background:var(--g);color:#fff;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;border:0;width:100%}
.hero h2{font-size:24px;line-height:1.15}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:5px 10px;border-radius:11px;background:#fff;color:var(--g-text)}
.badge.o{color:var(--o-text)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.3);color:#fff}
.bar{height:8px;border-radius:4px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--g)}
.hero .bar{background:rgba(255,255,255,.35)}
.hero .bar>i{background:#fff}
.hero-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.ev{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:22px;padding:12px;border:0;width:100%;text-align:left}
.datebox{width:58px;height:58px;flex-shrink:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-family:var(--display);font-size:22px;font-weight:900}
.datebox span{font-size:12px;font-weight:800;margin-top:3px}
.ev .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev .t b{font-size:16px;font-weight:800}
.ev .t span{font-size:13px;font-weight:600;color:var(--muted)}
.empty{background:var(--surface);border-radius:22px;padding:22px;text-align:center;color:var(--muted);font-weight:600;line-height:1.5}

/* event header */
.hdr{background:var(--g);color:#fff;border-radius:28px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.round{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center}
.hdr h1{font-size:26px;line-height:1.1}
.hdr .sub{font-size:14px;font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{border:0;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:118px;text-align:left;color:var(--ink)}
.tile.o{background:var(--o-tint)} .tile.g{background:var(--g-tint)}
.tile .head{display:flex;align-items:center;gap:10px;min-width:0}
.tile .head b{font-family:var(--display);font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibox{width:40px;height:40px;flex-shrink:0;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.tile.o .ibox{color:var(--o-deep)} .tile.g .ibox{color:var(--g-deep)}
.tile.o .bar>i{background:var(--o)} .tile.g .bar>i{background:var(--g)}
.tile small{font-size:12px;font-weight:700;color:var(--soft)}
.tile-add{border:2px dashed #D5D8DF;border-radius:22px;background:transparent;color:var(--muted);font-weight:800;min-height:118px}

/* quick add */
.qa{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -8px 24px rgba(47,58,79,.08);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.qa-in{max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.qa-field{display:flex;align-items:center;gap:8px;height:52px;border-radius:18px;background:var(--surface);padding:0 6px 0 16px}
.qa-field input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;outline:none}
.qa-go{width:40px;height:40px;border-radius:14px;border:0;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center}
.qa .chip{border:0;background:var(--surface);height:38px}
.qa .chip.sug{background:var(--o);color:#fff}

/* section screen */
.pill{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 6px;border-radius:18px;border:0;background:var(--surface);font-weight:700;font-size:13px;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:12px -4px 0;padding:0 4px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 64px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:0}
.seg .c{width:48px;height:48px;border-radius:24px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.seg button.on.o .c{background:var(--o);color:#fff}
.seg button.on.g .c{background:var(--g);color:#fff}
.sec-card{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sec-card.o{background:var(--o-tint)} .sec-card.g{background:var(--g-tint)}
.sec-card.o .bar>i{background:var(--o)} .sec-card.g .bar>i{background:var(--g)}
.sec-card .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-card h1{font-size:30px;line-height:1}
.sec-card small{font-size:13px;font-weight:700;color:var(--soft)}
.block{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-h h3{font-size:17px;display:flex;align-items:center;gap:8px}
.bh-ic{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.bh-ic svg.i{width:18px;height:18px}
.k-task .bh-ic{background:var(--surface);color:var(--ink)}
.k-buy .bh-ic{background:var(--o);color:#fff}
.k-store .bh-ic{background:var(--g);color:#fff}
.list.buy{background:var(--o-tint)}
.list.store{background:var(--g-tint)}
.list.buy .row+.row,.list.buy .addrow{border-color:rgba(156,53,9,.14)}
.list.store .row+.row,.list.store .addrow{border-color:rgba(63,84,16,.14)}
.ck.sq{border-radius:8px}
.list.buy .ck{border-color:#E9A889;background:#fff}
.list.buy .ck.on{background:var(--o);border-color:var(--o)}
.list.store .ck{border-color:#B9C98A;background:#fff}
.list.store .ck.on{background:var(--g-deep);border-color:var(--g-deep)}
.r.price{background:#fff;color:var(--o-text);padding:3px 8px;border-radius:8px;font-size:13px}
.r.qty{background:#fff;color:var(--g-text);padding:3px 8px;border-radius:8px}
.addrow .dash.sq{border-radius:8px}
.list.buy .addrow .dash{border-color:#E9A889}
.list.store .addrow .dash{border-color:#B9C98A}
.block-h small{font-size:12px;font-weight:700;color:var(--muted)}
.list{background:var(--surface);border-radius:18px;padding:2px 12px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:30px}
.row+.row{border-top:1px solid #E9ECF1}
.row .t{flex:1;min-width:0;font-size:15px;font-weight:600;background:none;border:0;text-align:left;padding:4px 0;overflow-wrap:anywhere}
.row .t.done{color:#9AA1AF;text-decoration:line-through;font-weight:500}
.row .r{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.ck{width:24px;height:24px;flex-shrink:0;border-radius:12px;border:2px solid #C9CDD6;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.ck svg{width:13px;height:13px;stroke:#fff;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--g);border-color:var(--g)}
.ck.on svg{opacity:1}
.addrow{display:flex;align-items:center;gap:10px;padding:8px 0 10px}
.addrow+.row,.row+.addrow{border-top:1px solid #E9ECF1}
.addrow .dash{width:24px;height:24px;flex-shrink:0;box-sizing:border-box;border-radius:12px;border:2px dashed #C9CDD6}
.addrow input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;padding:4px 0;outline:none}
.add-go{height:32px;padding:0 12px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.note{font-size:14px;font-weight:600;line-height:1.45;color:var(--soft);background:transparent;border:0;width:100%;resize:none;padding:0;margin-top:14px;outline:none}
.mini{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;border:0;white-space:nowrap}
.mini.have{background:var(--g-tint);color:var(--g-text)}
.mini.buy{background:var(--o-tint);color:var(--o-text)}
.mini.listed{background:var(--ink);color:#fff}
.dish{background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.dish-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dish-h button{border:0;background:none;padding:0;text-align:left;font-family:var(--display);font-weight:900;font-size:17px}
.dish .list{background:#fff}
.link-btn{border:0;background:none;color:#1E5FC9;font-weight:800;font-size:14px;padding:6px 0;text-align:left}
.soft-btn{height:46px;border-radius:14px;border:0;background:var(--surface);font-weight:800;font-size:14px}
.o-btn{height:46px;border-radius:14px;border:0;background:var(--o);color:#fff;font-weight:800;font-size:14px}
.g-btn{height:46px;border-radius:14px;border:0;background:var(--g);color:#fff;font-weight:800;font-size:14px}

/* guests */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;font-weight:700}
.guest{background:var(--surface);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.guest-top{display:flex;align-items:center;gap:12px}
.ava{width:40px;height:40px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:16px}
.guest-top .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:0;text-align:left}
.guest-top .t b{font-size:15px;font-weight:700}
.guest-top a{font-size:13px;font-weight:700;color:#1E5FC9;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tg-row{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tog{height:40px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;background:var(--g-todo);color:var(--g-text)}
.tog.on{background:var(--g-deep);color:#fff}
.tog svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* budget */
.money{background:var(--g);color:#fff;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.money .big{font-family:var(--display);font-size:34px;font-weight:900;line-height:1.05}
.money .cap{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.money .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.money .grid div{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.money .bar{background:rgba(255,255,255,.35)} .money .bar>i{background:#fff}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(47,58,79,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:24px}
.x{width:40px;height:40px;border-radius:14px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:800}
.field input,.field select,.field textarea{height:50px;box-sizing:border-box;border-radius:16px;border:0;background:var(--surface);padding:0 16px;font-size:16px;font-weight:600;width:100%;outline:none}
.field textarea{height:80px;padding:12px 16px;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{box-shadow:0 0 0 2px var(--g)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0}
.radios span{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.radios input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.radios input:focus-visible+span{outline:3px solid var(--o);outline-offset:2px}
.radios.toggles2 span{height:44px;border:0;background:var(--g-todo);color:var(--g-text);border-radius:14px;width:100%;justify-content:center;box-sizing:border-box}
.radios.toggles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.radios.toggles2 input:checked+span{background:var(--g-deep);color:#fff}
.primary{height:54px;border-radius:18px;border:0;background:var(--o);color:#fff;font-weight:800;font-size:16px}
.danger{height:46px;border-radius:14px;border:0;background:transparent;color:#B42318;font-weight:800;font-size:14px}
.picks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.picks button{flex-shrink:0;height:40px;padding:0 12px 0 4px;border-radius:20px;border:0;background:var(--surface);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.picks .ava{width:32px;height:32px;border-radius:16px;font-size:14px}
.store-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.store-row+.store-row{border-top:1px solid #E9ECF1}
.store-row b{flex:1;min-width:0;font-weight:600}
.step{width:34px;height:34px;border-radius:11px;border:0;background:#fff;font-weight:800;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;max-width:calc(100% - 40px);box-sizing:border-box;text-align:center}
.card{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card p{margin:0;line-height:1.5;color:var(--soft);font-weight:600;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -6px 20px rgba(47,58,79,.07);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px max(8px,env(safe-area-inset-right,0px)) 12px max(8px,env(safe-area-inset-left,0px));box-sizing:border-box}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:0}
.nav .pillic{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--ink);font-weight:800}
.nav button.on .pillic{background:var(--o);color:#fff}
.cal{background:var(--surface);border-radius:24px;padding:12px 8px;margin-top:12px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cday{height:46px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cday b{width:34px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-sizing:border-box}
.cday i{width:6px;height:6px;border-radius:3px;background:transparent}
.cday.dot i{background:var(--ink)}
.cday.past b{color:#A8AEBA}
.cday.today b{border:2px solid var(--ink)}

function adopt(r){ var d=r.data||{}; if(!d.events) return; d.syncedAt=Date.parse(r.updated_at); d.updatedAt=d.syncedAt; if(!d.ideas) d.ideas=[]; if(!d.store) d.store=[];

  if(res.error) throw res.error; S.syncedAt=stamp; persist(); }
async function syncNow(){
  if(!sb||!USER) return; if(syncing){ again=true; return; } syncing=true; setSync('saving');
  try{
    var res=await sb.from('planner_state').select('data,updated_at').eq('user_id',USER.id).maybeSingle();

    var r=res.data, dirty=!S.syncedAt||S.updatedAt>S.syncedAt;

function val(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
function radio(name){ var el=document.querySelector('input[name="'+name+'"]:checked'); return el?el.value:''; }
function checked(id){ var el=document.getElementById(id); return !!(el&&el.checked); }

function saveSheet(more){
  var t=UI.sheet.type, e=ev(), id=UI.sheet.id, o;
  if(t==='event'){
    var title=val('f-title'); if(!title){ document.getElementById('f-title').focus(); return; }
    var data={title:title,date:val('f-date'),time:val('f-time'),size:radio('f-size')||'small',price:num(val('f-price')),seats:num(val('f-seats')),budget:num(val('f-budget'))};
    if(id){ Object.assign(S.events.find(function(x){return x.id===id;}),data); save(); UI.sheet=null; render(); return; }
    var n=newEvent(data), src=S.events.find(function(x){return x.id===val('f-copy');});
    if(src){ var map={}; n.sections=src.sections.map(function(s){ var c=Object.assign({},s,{id:uid()}); map[s.id]=c.id; return c; });
      n.tasks=src.tasks.map(function(x){return {id:uid(),sec:map[x.sec],title:x.title,date:'',done:false};});
      n.buys=src.buys.map(function(x){return {id:uid(),sec:map[x.sec],title:x.title,price:x.price,done:false};});
      n.storeUse=src.storeUse.map(function(x){return {id:uid(),storeId:x.storeId,qty:x.qty,done:false};});
      n.dishes=JSON.parse(JSON.stringify(src.dishes)).map(function(d){ d.id=uid(); d.ing.forEach(function(g){g.id=uid(); g.st=g.st==='have'?'have':'buy';}); return d; });
      n.concept=src.concept; }
    S.events.push(n); save(); R={name:'event',id:n.id}; UI.sheet=null; render(); window.scrollTo(0,0); return;
  }
  if(t==='task'){ o=e.tasks.find(function(x){return x.id===id;}); o.title=val('f-title')||o.title; o.date=val('f-date'); o.sec=val('f-sec')||o.sec; }
  if(t==='buy'){ o=e.buys.find(function(x){return x.id===id;}); o.title=val('f-title')||o.title; o.price=num(val('f-price')); o.sec=val('f-sec')||o.sec; }
  if(t==='use'){ o=e.storeUse.find(function(x){return x.id===id;}); o.qty=Math.max(1,num(val('f-qty'))||1); }
  if(t==='expense'){ var tt=val('f-title'), am=num(val('f-amount')); if(!tt||!am){ document.getElementById(tt?'f-amount':'f-title').focus(); return; }
    if(id){ o=e.expenses.find(function(x){return x.id===id;}); o.title=tt; o.amount=am; o.sec=val('f-sec'); } else e.expenses.push({id:uid(),title:tt,amount:am,sec:val('f-sec')}); }
  if(t==='dish'){ var nm=val('f-title'); if(!nm){ document.getElementById('f-title').focus(); return; }
    if(id){ o=e.dishes.find(function(x){return x.id===id;}); o.name=nm; o.type=radio('f-type'); } else e.dishes.push({id:uid(),name:nm,type:radio('f-type'),ing:[]}); }
  if(t==='guest'){ var gn=val('f-name'); if(!gn){ document.getElementById('f-name').focus(); return; }
    var g={name:gn,tg:val('f-tg').replace(/^@/,'').replace(/^https?:\/\/t\.me\//,''),conf:checked('f-conf'),paid:checked('f-paid'),method:radio('f-method'),note:val('f-note')};
    if(id) Object.assign(e.guests.find(function(x){return x.id===id;}),g); else e.guests.push(Object.assign({id:uid()},g));
    if(more){ save(); UI.sheet={type:'guest'}; toast(gn+' — в списке'); var fn=document.getElementById('f-name'); if(fn) fn.focus(); return; } }
  if(t==='section'){ var sn=val('f-title'); if(!sn){ document.getElementById('f-title').focus(); return; }
    if(id) secById(e,id).name=sn; else { var ns={id:uid(),name:sn,kind:'tasks',icon:'custom'}; e.sections.push(ns); save(); UI.sheet=null; R={name:'sec',id:e.id,k:ns.id}; render(); return; } }
  if(t==='idea'){ o=S.ideas.find(function(x){return x.id===id;}); o.title=val('f-title')||o.title; o.text=val('f-text'); o.link=val('f-link'); o.sample=false; }
  if(t==='restore'){ try{ var d=JSON.parse(val('f-json')); if(!d||!d.events) throw 0; S=d; }catch(err){ toast('Не получилось прочитать копию. Вставьте текст целиком.'); return; } }
  save(); UI.sheet=null; render();
}
function delSheet(btn){
  if(btn.dataset.confirm!=='1'){ btn.dataset.confirm='1'; btn.textContent='Нажмите ещё раз, чтобы удалить'; return; }
  var t=UI.sheet.type, e=ev(), id=UI.sheet.id;
  function rm(arr){ var i=arr.findIndex(function(x){return x.id===id;}); if(i>=0) arr.splice(i,1); }
  if(t==='event'){ S.events=S.events.filter(function(x){return x.id!==id;}); save(); UI.sheet=null; go({name:'home'}); return; }
  if(t==='idea'){ S.ideas=S.ideas.filter(function(x){return x.id!==id;}); save(); UI.sheet=null; render(); return; }
  if(t==='task') rm(e.tasks); if(t==='buy') rm(e.buys); if(t==='use') rm(e.storeUse); if(t==='expense') rm(e.expenses); if(t==='dish') rm(e.dishes); if(t==='guest') rm(e.guests);
  if(t==='section'){ rm(e.sections); e.tasks=e.tasks.filter(function(x){return x.sec!==id;}); e.buys=e.buys.filter(function(x){return x.sec!==id;}); save(); UI.sheet=null; R={name:'event',id:e.id}; render(); return; }
  save(); UI.sheet=null; render();
}

function addItem(input,keep){ if(keep===undefined) keep=true;
  var type=input.dataset.add, text=input.value.trim(); if(!text) return;
  var e=ev();
  if(type==='idea'){ S.ideas.unshift({id:uid(),title:text,text:'',link:''}); save(); render(keep?input.id:null); return; }
  if(type==='task') e.tasks.push({id:uid(),sec:R.k,title:text,date:'',done:false});
  if(type==='buy'){ var m=text.match(/^(.*?)[\s,]+\$?\s?(\d[\d\s]*(?:[.,]\d+)?)\s*\$?$/); e.buys.push({id:uid(),sec:R.k,title:m?m[1].trim():text,price:m?num(m[2]):0,done:false}); }
  if(type==='ing'){ var d=e.dishes.find(function(x){return x.id===input.dataset.x;}); var parts=text.split(','); d.ing.push({id:uid(),name:parts[0].trim(),qty:parts.slice(1).join(',').trim(),st:'buy'}); }
  if(type==='store'){ var p=text.split(','), q=num(p[1])||1; S.store.push({id:uid(),name:p[0].trim(),qty:q}); }
  save(); render(keep?input.id:null);
}

}
function act(a,el){
  var e=ev(), id=el.dataset.id;
  switch(a){
    case 'home': go({name:'home'}); break;
    case 'go-settings': go({name:'settings'}); break;
    case 'nav': go({name:el.dataset.v}); break;
    case 'add-go': { var ai=document.getElementById(el.dataset.for); if(ai&&ai.value.trim()) addItem(ai); else if(ai) ai.focus(); break; }
    case 'sign-in': signIn(false); break;
    case 'sign-up': signIn(true); break;
    case 'sync-now': syncNow().then(function(){ render(); }); break;
    case 'sign-out': sb.auth.signOut().then(function(){ USER=null; render(); toast('Вы вышли. Данные остались на этом устройстве'); }); break;
    case 'cal-m': { var c=UI.cal; var dt=new Date(c.y,c.m+Number(el.dataset.v),1); UI.cal={y:dt.getFullYear(),m:dt.getMonth()}; render(); break; }
    case 'cal-day': UI.calDay=el.dataset.v; render(); break;
    case 'cal-tick': { var ce=S.events.find(function(x){return x.id===el.dataset.e;}), ct=ce.tasks.find(function(x){return x.id===id;}); ct.done=!ct.done; save(); render(); break; }
    case 'cal-open': go({name:'sec',id:el.dataset.e,k:el.dataset.k}); break;
    case 'ifilter': UI.ifilter=el.dataset.v; render(); break;
    case 'idea-go': { var ia=document.getElementById('idea-add'); if(ia.value.trim()) addItem(ia); else ia.focus(); break; }
    case 'idea-to-event': { var idv=S.ideas.find(function(x){return x.id===UI.sheet.id;});
      var ne=newEvent({title:val('f-title')||idv.title,concept:val('f-text')||idv.text,size:'small'}); S.events.push(ne);
      S.ideas=S.ideas.filter(function(x){return x.id!==idv.id;}); save();
      R={name:'event',id:ne.id}; UI.sheet={type:'event',id:ne.id}; render(); window.scrollTo(0,0); toast('Идея стала событием — выберите дату'); break; }
    case 'filter': UI.filter=el.dataset.v; render(); break;
    case 'gfilter': UI.gfilter=el.dataset.v; render(); break;
    case 'open': UI.gfilter='all'; go({name:'event',id:id}); break;
    case 'sec': go({name:'sec',id:R.id,k:el.dataset.k}); break;
    case 'tick': { var arr=el.dataset.t==='task'?e.tasks:el.dataset.t==='buy'?e.buys:e.storeUse; var o=arr.find(function(x){return x.id===id;}); o.done=!o.done; save(); render(); break; }
    case 'gconf': case 'gpaid': { var g=e.guests.find(function(x){return x.id===id;}); if(a==='gconf') g.conf=!g.conf; else g.paid=!g.paid; save(); render(); break; }
    case 'ing': { var d=e.dishes.find(function(x){return x.id===el.dataset.d;}), gi=d.ing.find(function(x){return x.id===id;});
      gi.st=gi.st==='have'?'buy':'have'; save(); render(); break; }
    case 'ing-to-buy': { var dd=e.dishes.find(function(x){return x.id===id;}), fs=e.sections.find(function(s){return s.kind==='food';})||e.sections[0], c=0;
      dd.ing.forEach(function(g){ if(g.st==='buy'){ e.buys.push({id:uid(),sec:fs.id,title:g.name+(g.qty?' '+g.qty:''),price:0,done:false}); g.st='listed'; c++; } });
      save(); toast(c+' '+plural(c,['продукт','продукта','продуктов'])+' добавлено в «Купить»'); break; }
    case 'sq': { var si=S.store.find(function(x){return x.id===id;}); si.qty=Math.max(0,si.qty+Number(el.dataset.v)); save(); render(); break; }
    case 'use-add': e.storeUse.push({id:uid(),storeId:id,qty:1,done:false}); save(); render(); break;
    case 'pick-guest': document.getElementById('f-name').value=el.dataset.n; document.getElementById('f-tg').value=el.dataset.tg?'@'+el.dataset.tg:''; break;
    case 'dish-copy': { var src=null; S.events.forEach(function(x){ x.dishes.forEach(function(d){ if(d.id===id) src=d; }); });
      var cp=JSON.parse(JSON.stringify(src)); cp.id=uid(); cp.ing.forEach(function(g){g.id=uid(); g.st=g.st==='have'?'have':'buy';}); e.dishes.push(cp); save(); UI.sheet=null; render(); toast('«'+cp.name+'» добавлено в меню'); break; }
    case 'qa-pick': quickAdd(el.dataset.k); break;
    case 'qa-add': quickAdd(); break;
    case 'save': saveSheet(el.dataset.more==='1'); break;
    case 'del': delSheet(el); break;
    case 'close': UI.sheet=null; render(); break;
    case 'close-bg': break;
    case 'backup': { var txt=JSON.stringify(S);
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('Скопировано — вставьте в заметки');},function(){ UI.sheet={type:'restore'}; render(); var f=document.getElementById('f-json'); f.value=txt; f.select(); toast('Выделено — скопируйте вручную'); }); }
      break; }
    case 'del-samples': S.events=S.events.filter(function(x){return !x.sample;}); S.ideas=S.ideas.filter(function(x){return !x.sample;}); save(); toast('Примеры удалены'); break;
    default:
      if(a.indexOf('sheet-')===0){ UI.sheet={type:a.slice(6),id:id||null}; render(); var first=layer.querySelector('.sheet input:not([type=radio]):not([type=checkbox]),.sheet textarea'); if(first&&!id) first.focus(); }
  }
}
document.addEventListener('click',function(ev0){
  var el=ev0.target.closest('[data-a]'); if(!el) return;
  if(el.dataset.a==='close-bg'){ if(ev0.target===el){ UI.sheet=null; render(); } return; }
  act(el.dataset.a,el);
});
document.addEventListener('keydown',function(k){
  var t=k.target;
  if(k.key==='Enter'&&t.dataset&&t.dataset.add){ k.preventDefault(); addItem(t); }
  if(k.key==='Enter'&&t.id==='qa'){ k.preventDefault(); quickAdd(); }
  if(k.key==='Escape'&&UI.sheet){ UI.sheet=null; render(); }
});
document.addEventListener('focusout',function(f){
  var t=f.target; if(!t.dataset||!t.dataset.add||!t.value.trim()) return;
  var to=f.relatedTarget; if(to&&to.dataset&&to.dataset.a==='add-go') return;
  setTimeout(function(){ if(document.body.contains(t)&&t.value.trim()) addItem(t,false); },0);
});
document.addEventListener('input',function(i){
  if(i.target.id==='qa'){ UI.quick=i.target.value; var c=document.getElementById('qa-chips'); if(c) c.innerHTML=vChips(); }
});
document.addEventListener('change',function(c){
  if(c.target.dataset&&c.target.dataset.change==='concept'){ ev().concept=c.target.value; save(); }
});
/* swipe between sections */
var sx=null, sy=null;
app.addEventListener('touchstart',function(t){ if(R.name!=='sec') return; sx=t.touches[0].clientX; sy=t.touches[0].clientY; },{passive:true});
app.addEventListener('touchend',function(t){
  if(R.name!=='sec'||sx===null) return;
  var dx=t.changedTouches[0].clientX-sx, dy=t.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5) return;
  if(t.target.closest('.seg,.chips,input,textarea')) return;
  var keys=allKeys(ev()), i=keys.indexOf(R.k), n=i+(dx<0?1:-1);
  if(n>=0&&n<keys.length) go({name:'sec',id:R.id,k:keys[n]});
},{passive:true});

render();
initAuth();
if('serviceWorker' in navigator&&!PREVIEW&&location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>

</body>
