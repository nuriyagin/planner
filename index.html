<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер событий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Manrope:wght@500;600;700;800&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one phone-width column, white ground, tinted tiles; quick-add bar pinned to the bottom */
:root{
  --bg:#FFFFFF; --ink:#2F3A4F; --muted:#6B7385; --soft:#556074; --surface:#F4F6F9; --line:#E3E5EA;
  --o:#F89A6F; --o-tint:#FDE3D6; --o-deep:#C4592A; --o-text:#9C3509;
  --g:#A7C048; --g-tint:#EEF3DC; --g-deep:#5B7716; --g-todo:#E4EDC4; --g-text:#3F5410;
  --display:'Nunito', ui-rounded, system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, sans-serif;
  --acc:#F89A6F; --acc-t:#FFFFFF; --acc-tint:#FDE3D6; --acc-deep:#C4592A;
  --ev1:#A7C048; --ev1-t:#FFFFFF;
  color-scheme: light;
}
html,body{height:100%;overflow-x:hidden}
input,select,textarea{font-size:16px!important}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px;box-sizing:border-box}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:900;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* top of home */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top h1{font-size:34px;line-height:1.05}
.actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.plus{width:52px;height:52px;border-radius:18px;border:0;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center}
.plus svg.i{width:26px;height:26px;stroke-width:2.6}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* event cards on home */
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.hero{background:var(--g);color:#fff;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;border:0;width:100%}
.hero h2{font-size:24px;line-height:1.15}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:5px 10px;border-radius:11px;background:#fff;color:var(--g-text)}
.badge.o{color:var(--o-text)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.3);color:#fff}
.bar{height:8px;border-radius:4px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--g)}
.hero .bar{background:rgba(255,255,255,.35)}
.hero .bar>i{background:#fff}
.hero-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.ev{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:22px;padding:12px;border:0;width:100%;text-align:left}
.datebox{width:58px;height:58px;flex-shrink:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-family:var(--display);font-size:22px;font-weight:900}
.datebox span{font-size:12px;font-weight:800;margin-top:3px}
.ev .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev .t b{font-size:16px;font-weight:800}
.ev .t span{font-size:13px;font-weight:600;color:var(--muted)}
.empty{background:var(--surface);border-radius:22px;padding:22px;text-align:center;color:var(--muted);font-weight:600;line-height:1.5}

/* event header */
.hdr{background:var(--ev1);color:var(--ev1-t);border-radius:28px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.round{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center}
.hdr h1{font-size:26px;line-height:1.1}
.hdr .sub{font-size:14px;font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{border:0;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:118px;text-align:left;color:var(--ink)}
.tile.o{background:var(--o-tint)} .tile.g{background:var(--g-tint)}
.tile .head{display:flex;align-items:center;gap:10px;min-width:0}
.tile .head b{font-family:var(--display);font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibox{width:40px;height:40px;flex-shrink:0;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}
.tile.o .ibox{color:var(--o-deep)} .tile.g .ibox{color:var(--g-deep)}
.tile.o .bar>i{background:var(--o)} .tile.g .bar>i{background:var(--g)}
.tile small{font-size:12px;font-weight:700;color:var(--soft)}
.secrows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.srow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:12px 14px;border:0;width:100%;text-align:left;color:var(--ink)}
.srow .ibox{color:var(--ink)}
.srow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.srow .top1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.srow .top1 b{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .top1 small{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.thin{height:5px;border-radius:3px;background:#E3E7EE;overflow:hidden}
.thin>i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.srow-add{height:52px;border:2px dashed #D5D8DF;border-radius:20px;background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.tile-add{border:2px dashed #D5D8DF;border-radius:22px;background:transparent;color:var(--muted);font-weight:800;min-height:118px}

/* quick add */
.qa{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -8px 24px rgba(47,58,79,.08);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.qa-in{max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.qa-field{display:flex;align-items:center;gap:8px;height:52px;border-radius:18px;background:var(--surface);padding:0 6px 0 16px}
.qa-field input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;outline:none}
.qa-go{width:40px;height:40px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-t);display:flex;align-items:center;justify-content:center}
.qa .chip{border:0;background:var(--surface);height:38px}
.qa .chip.sug{background:var(--acc);color:var(--acc-t)}

/* section screen */
.pill{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 6px;border-radius:18px;border:0;background:var(--surface);font-weight:700;font-size:13px;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:12px -4px 0;padding:0 4px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 64px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:0}
.seg .c{width:48px;height:48px;border-radius:24px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.seg button.on.o .c{background:var(--acc);color:var(--acc-t)}
.seg button.on.g .c{background:var(--acc);color:var(--acc-t)}
.sec-card{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sec-card.o,.sec-card.g{background:var(--surface)}
.sec-card .bar{background:#E3E7EE} .sec-card.o .bar>i,.sec-card.g .bar>i{background:var(--acc)}
.sec-card .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-card h1{font-size:30px;line-height:1}
.sec-card small{font-size:13px;font-weight:700;color:var(--soft)}
.block{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-h h3{font-size:17px;display:flex;align-items:center;gap:8px}
.bh-ic{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.bh-ic svg.i{width:18px;height:18px}
.k-task .bh-ic{background:var(--surface);color:var(--ink)}
.k-buy .bh-ic{background:var(--o);color:#fff}
.k-store .bh-ic{background:var(--g);color:#fff}
.list.buy{background:var(--o-tint)}
.list.store{background:var(--g-tint)}
.list.buy .row+.row,.list.buy .addrow{border-color:rgba(156,53,9,.14)}
.list.store .row+.row,.list.store .addrow{border-color:rgba(63,84,16,.14)}
.ck.sq{border-radius:8px}
.list.buy .ck{border-color:#E9A889;background:#fff}
.list.buy .ck.on{background:var(--o);border-color:var(--o)}
.list.store .ck{border-color:#B9C98A;background:#fff}
.list.store .ck.on{background:var(--g-deep);border-color:var(--g-deep)}
.r.price{background:#fff;color:var(--o-text);padding:3px 8px;border-radius:8px;font-size:13px}
.r.qty{background:#fff;color:var(--g-text);padding:3px 8px;border-radius:8px}
.addrow .dash.sq{border-radius:8px}
.list.buy .addrow .dash{border-color:#E9A889}
.list.store .addrow .dash{border-color:#B9C98A}
.block-h small{font-size:12px;font-weight:700;color:var(--muted)}
.list{background:var(--surface);border-radius:18px;padding:2px 12px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:30px}
.row+.row{border-top:1px solid #E9ECF1}
.row .t{flex:1;min-width:0;font-size:15px;font-weight:600;background:none;border:0;text-align:left;padding:4px 0;overflow-wrap:anywhere}
.row .t.done{color:#9AA1AF;text-decoration:line-through;font-weight:500}
.row .r{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.ck{width:24px;height:24px;flex-shrink:0;border-radius:12px;border:2px solid #C9CDD6;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.ck svg{width:13px;height:13px;stroke:#fff;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on svg{opacity:1}
.addrow{display:flex;align-items:center;gap:10px;padding:8px 0 10px}
.addrow+.row,.row+.addrow{border-top:1px solid #E9ECF1}
.addrow .dash{width:24px;height:24px;flex-shrink:0;box-sizing:border-box;border-radius:12px;border:2px dashed #C9CDD6}
.addrow input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;padding:4px 0;outline:none}
.add-go{height:32px;padding:0 12px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.note{font-size:16px;font-weight:600;line-height:1.45;color:var(--soft);background:transparent;border:0;width:100%;resize:none;padding:0;margin-top:14px;outline:none}
.mini{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;border:0;white-space:nowrap}
.mini.have{background:var(--g-tint);color:var(--g-text)}
.mini.buy{background:var(--o-tint);color:var(--o-text)}
.mini.listed{background:var(--ink);color:#fff}
.dish{background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.dish-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dish-h button{border:0;background:none;padding:0;text-align:left;font-family:var(--display);font-weight:900;font-size:17px}
.dish .list{background:#fff}
.link-btn{border:0;background:none;color:#1E5FC9;font-weight:800;font-size:14px;padding:6px 0;text-align:left}
.soft-btn{height:46px;border-radius:14px;border:0;background:var(--surface);font-weight:800;font-size:14px}
.o-btn{height:46px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-t);font-weight:800;font-size:14px}
.g-btn{height:46px;border-radius:14px;border:0;background:var(--g);color:#fff;font-weight:800;font-size:14px}

/* guests */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;font-weight:700}
.guest{background:var(--surface);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.guest-top{display:flex;align-items:center;gap:12px}
.ava{width:40px;height:40px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:16px}
.guest-top .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:0;text-align:left}
.guest-top .t b{font-size:15px;font-weight:700}
.guest-top a{font-size:13px;font-weight:700;color:#1E5FC9;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tg-row{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tog{background:#FFF1C2!important;color:#6B4E00!important;min-height:40px;padding:6px 8px;line-height:1.2;text-align:center;min-width:0;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;background:var(--g-todo);color:var(--g-text)}
.tog.on{background:#5B7716!important;color:#fff!important}
.tog svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* budget */
.money{background:var(--ev1);color:var(--ev1-t);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.money .big{font-family:var(--display);font-size:34px;font-weight:900;line-height:1.05}
.money .cap{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.money .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.money .grid div{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.money .bar{background:rgba(255,255,255,.35)} .money .bar>i{background:#fff}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(47,58,79,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:24px}
.x{width:40px;height:40px;border-radius:14px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:800}
.field input,.field select,.field textarea{height:50px;box-sizing:border-box;border-radius:16px;border:0;background:var(--surface);padding:0 16px;font-size:16px;font-weight:600;width:100%;outline:none}
.field textarea{height:80px;padding:12px 16px;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{box-shadow:0 0 0 2px var(--g)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0}
.radios span{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.radios input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.radios input:focus-visible+span{outline:3px solid var(--o);outline-offset:2px}
.radios.toggles2 span{height:44px;border:0;background:#FFF1C2;color:#6B4E00;border-radius:14px;width:100%;justify-content:center;box-sizing:border-box}
.radios.toggles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.radios.toggles2 input:checked+span{background:#5B7716;color:#fff}
.primary{height:54px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-t);font-weight:800;font-size:16px}
.danger{height:46px;border-radius:14px;border:0;background:transparent;color:#B42318;font-weight:800;font-size:14px}
.picks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.picks button{flex-shrink:0;height:40px;padding:0 12px 0 4px;border-radius:20px;border:0;background:var(--surface);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.picks .ava{width:32px;height:32px;border-radius:16px;font-size:14px}
.store-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.store-row+.store-row{border-top:1px solid #E9ECF1}
.store-row b{flex:1;min-width:0;font-weight:600}
.step{width:34px;height:34px;border-radius:11px;border:0;background:#fff;font-weight:800;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;max-width:calc(100% - 40px);box-sizing:border-box;text-align:center}
.card{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card p{margin:0;line-height:1.5;color:var(--soft);font-weight:600;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -6px 20px rgba(47,58,79,.07);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px max(4px,env(safe-area-inset-right,0px)) 12px max(8px,env(safe-area-inset-left,0px));box-sizing:border-box}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:0}
.nav .pillic{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--ink);font-weight:800}
.nav button.on .pillic{background:var(--o);color:#fff}
.nav button.on.lav .pillic{background:#BDBDFB;color:var(--ink)}
.nav button.on.pink .pillic{background:#F5B8CB;color:var(--ink)}
.nav .pillic{max-width:100%}
/* lists: films / series / books */
.l-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#FDECF1;border-radius:16px;padding:4px;margin-top:4px}
.l-seg button{height:42px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:14px;color:#8A5566;min-width:0}
.l-seg button svg.i{width:18px;height:18px}
.l-seg button small{font-size:12px;font-weight:800;opacity:.7}
.l-seg button.on{background:#F5B8CB;color:var(--ink)}
.l-chips{margin-top:12px}
.l-chips .chip.on{background:#F5B8CB;border-color:#F5B8CB;color:var(--ink)}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;margin-top:14px}
.lcard{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.lcover{aspect-ratio:2/3;width:100%;border-radius:18px;overflow:hidden;background:#FDECF1;display:flex;align-items:center;justify-content:center}
.lcover img{width:100%;height:100%;object-fit:cover;display:block;background:#F7DDE5}
.lcover .lph{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;text-align:center;color:#9B4A63;font-family:var(--display);font-weight:900;font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.lcover .lph svg.i{width:34px;height:34px;opacity:.55}
.lcard>b{font-size:15px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;margin-top:2px}
.gtags{display:flex;flex-wrap:wrap;gap:4px}
.gtag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:#FDECF1;color:#8A2E4C}
.lcard p{margin:0;font-size:13px;font-weight:600;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lcard:hover .lcover{filter:brightness(.97)}
.l-add{aspect-ratio:2/3;border:2px dashed #EBC3D0;border-radius:18px;background:transparent;color:#9B4A63;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.l-add svg.i{width:28px;height:28px}
.lph-wrap{display:flex;gap:14px;align-items:flex-end}
.lph-thumb{width:112px;aspect-ratio:2/3;flex-shrink:0;border:0;padding:0;border-radius:14px;overflow:hidden;background:#FDECF1;display:flex;align-items:center;justify-content:center;color:#C98299}
.lph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lph-thumb svg.i{width:30px;height:30px}
.lph-wrap .ph-row{flex-direction:column;align-items:flex-start}
.gpicks{display:flex;flex-wrap:wrap;gap:6px}
.gpicks button{height:34px;padding:0 12px;border-radius:17px;border:0;background:var(--surface);font-weight:700;font-size:13px}
.gpicks button.on{background:#F5B8CB;color:var(--ink)}
.l-sub{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;border-bottom:2px solid #F6E1E8}
.l-sub button{height:42px;border:0;background:none;font-weight:800;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:-2px;border-bottom:3px solid transparent}
.l-sub button small{font-size:12px;opacity:.75}
.l-sub button.on{color:var(--ink);border-bottom-color:#E58AA8}
.ldate{font-size:12px;font-weight:800;color:#5B7716;display:inline-flex;align-items:center;gap:4px}
.ldate svg.i{width:14px;height:14px;stroke-width:2.6}
.cal{background:var(--surface);border-radius:24px;padding:12px 8px;margin-top:12px}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cday{height:46px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cday b{width:34px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-sizing:border-box}
.cday i{width:6px;height:6px;border-radius:3px;background:transparent}
.cday.dot i{background:var(--ink)}
.cday.past b{color:#A8AEBA}
.cday.today b{border:2px solid var(--ink)}
.cday.sel b{background:var(--g-tint)}
.cday.evd b{background:var(--o);color:#fff;font-weight:800}
.cday.sel.evd b{box-shadow:0 0 0 3px var(--g)}
.legend2{display:flex;gap:14px;font-size:12px;font-weight:700;margin-top:10px;flex-wrap:wrap}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.evtag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;border:0;align-self:flex-start}
.ideas{columns:2;column-gap:10px;margin-top:12px}
.idea{break-inside:avoid;display:flex;flex-direction:column;gap:6px;width:100%;margin-bottom:10px;border:0;border-radius:22px;padding:14px;text-align:left;color:var(--ink)}
.idea small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.idea b{font-size:15px;font-weight:800;line-height:1.3}
.idea span{font-size:13px;font-weight:600;line-height:1.45;color:var(--soft);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.subtabs{display:flex;gap:4px;background:var(--surface);border-radius:16px;padding:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;height:40px;padding:0 12px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:14px;color:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.subtabs button span{font-size:12px;font-weight:800;color:var(--muted)}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(47,58,79,.12)}
.subtabs button.on span{color:var(--acc-deep)}
.k-insp .bh-ic{background:var(--acc-tint);color:var(--acc-deep)}
.insp-add{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:16px;padding:6px 6px 6px 14px}
.insp-add input{flex:1;min-width:0;border:0;background:transparent;font-weight:600;outline:none;padding:6px 0}
.ph-btn{width:40px;height:40px;flex-shrink:0;border-radius:12px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.insp-grid{columns:2;column-gap:8px;margin-top:4px}
.insp{break-inside:avoid;width:100%;margin:0 0 8px;border:0;border-radius:16px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink)}
.insp.yes{background:var(--g-tint)}
.insp.no{opacity:.5}
.insp-img{width:100%;border-radius:10px;display:block;background:#E3E7EE;min-height:70px;object-fit:cover}
.insp-t{font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;white-space:pre-line}
.insp-l{font-size:12px;font-weight:700;color:#1E5FC9;display:flex;align-items:center;gap:4px;overflow-wrap:anywhere}
.insp-l svg.i{width:14px;height:14px}
.insp-f{display:flex;gap:4px;flex-wrap:wrap}
.st{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:#fff;color:var(--soft)}
.insp.yes .st{background:var(--g-deep);color:#fff}
.st.task{background:var(--ink)!important;color:#fff!important}
.zone-d{margin:0;font-size:13px;font-weight:600;color:var(--soft);line-height:1.45}
.mini.store{background:var(--g-tint);color:var(--g-text)}
.cover{position:relative;border-radius:28px;overflow:hidden;height:170px;margin-bottom:10px;background:#E3E7EE}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-btn{position:absolute;right:12px;bottom:12px;height:34px;padding:0 12px;border-radius:12px;border:0;background:rgba(255,255,255,.92);font-weight:800;font-size:13px;color:var(--ink)}
.hero-cover{display:block;margin:-18px -18px 0;height:140px;overflow:hidden;background:rgba(255,255,255,.25)}
.hero-cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph-field{display:flex;flex-direction:column;gap:8px}
.ph-thumb{border:0;padding:0;background:none;border-radius:14px;overflow:hidden;max-width:160px}
.ph-thumb img{width:100%;display:block;min-height:60px;background:#E3E7EE}
.ph-row{display:flex;gap:8px;flex-wrap:wrap}
.ph-row button{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--surface);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(20,24,32,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain}
.sheet>*{flex-shrink:0}
.btn2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn2 button{height:52px;border-radius:16px;font-size:15px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:80px!important;text-align:center}
.stepper .step{width:50px;height:50px;border-radius:16px;background:var(--surface);font-size:20px}
.plus1{font-weight:800;color:var(--acc-deep)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw label{position:relative;display:block}
.sw input[type=radio]{position:absolute;opacity:0;inset:0;margin:0}
.sw span{display:block;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);position:relative;overflow:hidden}
.sw input[type=radio]:checked+span{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.sw input[type=radio]:focus-visible+span{outline:3px solid var(--o);outline-offset:4px}
.sw-c span{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.sw-c input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.sw-prev{display:flex;gap:8px;align-items:center;border-radius:16px;padding:12px;font-weight:800;font-size:14px}
.sw-prev b{padding:8px 12px;border-radius:11px;font-size:13px}
.lav-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#F1F1FD;border-radius:16px;padding:4px;margin-top:4px}
.lav-seg button{height:42px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:14px;color:var(--muted)}
.lav-seg button.on{background:#BDBDFB;color:var(--ink)}
.stores{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.stores::-webkit-scrollbar{display:none}
.stores button{flex-shrink:0;height:38px;padding:0 13px 0 10px;border-radius:19px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px #E3E3F5;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--ink)}
.stores button svg.i{width:17px;height:17px}
.stores button.on{background:#FAE2A3;box-shadow:none}
.stores small{font-size:12px;font-weight:800;opacity:.7}
.often{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.often::-webkit-scrollbar{display:none}
.often button{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:1.5px dashed #B9B9E8;background:transparent;font-weight:700;font-size:13px;color:var(--ink)}
.lav-list{background:#F7F7FE;border-radius:18px;padding:2px 12px;display:flex;flex-direction:column;margin-top:12px}
.lav-list .row+.row,.lav-list .addrow{border-color:#ECECF8}
.lav-list .ck{border-color:#B9B9E8;background:#fff}
.lav-list .ck.on{background:#BDBDFB;border-color:#BDBDFB}
.lav-list .ck.on svg{stroke:var(--ink)}
.lav-list .ck.sq{border-radius:7px}
.bought{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;margin-top:12px;font-weight:700;font-size:14px;width:100%;box-sizing:border-box;border:0;text-align:left;color:var(--ink)}
.bought .lnk{font-size:13px;font-weight:800;color:#4B4BB0;background:none;border:0;padding:0}
.focus{background:#FDF4DC;border-radius:20px;padding:8px 12px 2px;margin-top:14px}
.focus .ck{border-color:#D9B95E;background:#fff}
.focus .row+.row,.focus .tdwrap+.tdwrap{border-color:#F3E3B5}
.fh{display:flex;align-items:center;gap:6px;padding:4px 0}
.fh b{font-family:var(--display);font-size:16px;font-weight:900}
.fh small,.lh small{font-size:12px;font-weight:700;color:var(--muted)}
.lh{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.lh b{font-family:var(--display);font-size:16px;font-weight:900}
.t-chips{margin-top:12px}
.t-chips .chip.on{background:#BDBDFB;border-color:#BDBDFB;color:var(--ink)}
.t-chips .chip.add{border-style:dashed;color:var(--muted)}
.lh .lh-ed{border:0;background:none;padding:0;font-size:13px;font-weight:800;color:#4B4BB0}
.blk-h{display:flex;align-items:baseline;gap:8px;margin-top:18px}
.blk-h b{font-family:var(--display);font-size:16px;font-weight:900}
.blk-h small{font-size:12px;font-weight:700;color:var(--muted)}
.blk-tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:#EDEDFD;color:#4B4BB0;margin-top:3px;align-self:flex-start}
.tdwrap+.tdwrap{border-top:1px solid #ECECF8}
.tdrow{display:flex;align-items:center;gap:10px;padding:10px 0}
.tdrow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.tdrow .mid b{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tdrow .prog{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}
.tdrow .prog i{flex:0 0 70px;height:4px;border-radius:2px;background:#E3E3F5;overflow:hidden}
.tdrow .prog i b{display:block;height:100%;background:#BDBDFB}
.due{font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;background:#FAE2A3;color:#6B4E00;white-space:nowrap}
.due.soft{background:#F1F1FD;color:#4B4BB0}
.star,.chev{width:32px;height:32px;flex-shrink:0;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:#B9B9E8}
.star svg,.chev svg{width:19px;height:19px}
.star.on{color:#C99A12}
.star.on svg{fill:#F2C744}
.chev{color:var(--muted)}
.subs{margin:0 0 10px 10px;padding-left:20px;border-left:2px solid #DCDCF5;display:flex;flex-direction:column}
.subs .row{padding:6px 0;min-height:0}
.subs .row+.row{border-top:0}
.subs .ck{width:20px;height:20px;border-radius:6px}
.subs .t{font-size:14px}
.subs .addrow{padding:6px 0 8px;border-top:0!important}
.subs .addrow .dash{width:20px;height:20px;border-radius:6px;border-color:#C9C9EC}
.close-all{align-self:flex-start;margin:0 0 8px 32px;height:32px;padding:0 12px;border-radius:10px;border:0;background:#BDBDFB;font-weight:800;font-size:13px;color:var(--ink)}
.qa.todo{bottom:calc(66px + env(safe-area-inset-bottom,0px));box-shadow:none;background:transparent;padding-bottom:0}
.qa.todo .qa-in{padding-bottom:8px}
.qa.todo .qa-field{background:#F1F1FD;box-shadow:0 4px 14px rgba(47,58,79,.08)}
.qa.todo .qa-go{background:#BDBDFB;color:var(--ink)}
.idea-btn{position:relative}
.idea-btn em{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#FAE2A3;color:#6B4E00;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand{display:none}
.nav.sub{display:none}
.srow:hover,.ev:hover{background:#ECEFF4}
.srow.on{background:#fff;box-shadow:0 0 0 2px var(--acc) inset}
@media (min-width:900px){
  body{zoom:.86}
  .nav,.nav.sub{display:block;top:0;bottom:0;left:0;right:auto;width:232px;border-radius:0;box-shadow:none;border-right:1px solid #ECEEF2;padding:0}
  .nav-in{display:flex;flex-direction:column;gap:4px;padding:28px 16px;max-width:none}
  .brand{display:block;font-family:var(--display);font-weight:900;font-size:24px;padding:0 10px 18px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:6px 8px;border-radius:14px;color:var(--soft)}
  .nav button:hover{background:var(--surface)}
  .nav .pillic{width:38px;height:38px;border-radius:12px}
  #app{max-width:1180px;margin:0 0 0 232px;padding:32px 40px 60px;padding-left:40px;padding-right:40px}
  .qa{left:232px;border-radius:0;box-shadow:0 -1px 0 #ECEEF2}
  .qa.todo{bottom:0;background:#fff;box-shadow:0 -1px 0 #ECEEF2}
  .todo-w{max-width:760px}
  .qa-in{max-width:none;padding:12px 40px 16px;flex-direction:row;align-items:center}
  .qa-field{flex:0 0 440px}
  .top h1{font-size:40px}
  .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .stack .hero{grid-column:1/-1}
  .stack .empty,.stack .o-btn{grid-column:1/-1}
  .split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:28px;align-items:start;margin-top:4px}
  .split .left{position:sticky;top:20px}
  .split .right{min-width:0}
  .split .right>.sec-card:first-child,.split .right>.stats:first-child,.split .right>.money:first-child{margin-top:12px}
  .hdr{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:18px 22px}
  .hdr-row{order:2;margin-left:auto}
  .hdr>div:nth-child(2){order:1;flex:1;min-width:240px}
  .hdr .bar{order:3;flex-basis:100%}
  .hdr h1{font-size:30px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .tab{height:44px;padding:0 16px 0 12px;border-radius:14px;border:0;background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--ink)}
  .tab svg.i{width:20px;height:20px}
  .tab:hover{background:#ECEFF4}
  .tab.on{background:var(--acc);color:var(--acc-t)}
  .tab.add{background:transparent;border:2px dashed #D5D8DF;color:var(--muted)}
  .split2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
  .split2.solo{grid-template-columns:minmax(0,1fr)}
  .split2 .up{position:sticky;top:20px}
  .cal-split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
  .cday{height:64px}
  .cday b{width:44px;height:38px;font-size:16px}
  .ideas{columns:3}
  .lists-w{max-width:1000px}
  .lgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 16px}
  .l-seg{max-width:520px}
  .insp-grid{columns:3}
  .cover{height:240px}
  .settings-w{max-width:640px}
  .backdrop{align-items:center;padding:24px}
  .sheet{border-radius:28px;max-width:560px;max-height:85vh;padding:24px}
  .toast{bottom:40px;left:calc(50% + 116px)}
  .guests-grid{display:flex;flex-direction:column;gap:8px}
  .guest{flex-direction:row;align-items:center;gap:16px;padding:12px 14px}
  .guest-top{flex:1;min-width:0}
  .guest .toggles{flex:0 0 380px}
  button:hover .c{filter:brightness(.97)}
}
